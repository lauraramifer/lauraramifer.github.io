<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Work — Laura Ramirez F.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400;0,500;0,600;1,400&family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/site.css" />
  </head>
  <body data-page="work">
    <a class="skip" href="#main">Skip to work</a>
    <header class="masthead" data-masthead></header>
    <main id="main">
      <div class="wrap">
        <header class="work-page-header category-intro" data-work-intro></header>
        <section class="work-grid" data-work-grid></section>
        <footer class="site-footer" data-footer></footer>
      </div>
    </main>
    <div class="player" data-player hidden>
      <div class="player-frame">
        <div data-player-frame></div>
        <div class="player-bar">
          <span data-player-title></span>
          <button class="player-close" type="button">Close</button>
        </div>
      </div>
    </div>
    <script src="js/site.js"></script>
  </body>
</html>
