<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Laura Ramirez F.</title>
    <meta
      name="description"
      content="Laura Ramírez — creative producer and post-production lead. Motion, ads, and music."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600&family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/reel.css" />
  </head>
  <body>
    <a class="skip" href="#stage">Skip to reel</a>
    <header class="top">
      <button class="name" type="button" id="about-open" aria-expanded="false" aria-controls="about">
        Laura Ramirez F.
      </button>
      <nav class="links" aria-label="Site">
        <span class="year" id="year"></span>
        <a href="work.html">All work</a>
        <a class="contact" id="contact" href="https://www.linkedin.com/in/lauraramirezf/">Contact</a>
      </nav>
    </header>

    <main class="stage" id="stage">
      <div class="titlecard" id="titlecard">
        <p id="titlecard-name">Laura Ramirez F.</p>
      </div>
      <button class="frame" type="button" id="frame" aria-pressed="false" aria-label="Hold the current piece">
        <img id="still" alt="" />
        <span class="flash" id="flash" aria-hidden="true"></span>
      </button>
      <section class="about" id="about" hidden>
        <div class="about-copy" id="about-copy"></div>
        <button class="about-close" type="button" id="about-close">Close</button>
      </section>
    </main>

    <footer class="transport">
      <div class="credit">
        <button class="hold" type="button" id="hold">Loading</button>
        <p class="detail" id="detail" hidden></p>
      </div>
      <div class="playhead" id="playhead">
        <span class="playhead-line" id="playhead-line"></span>
        <ol id="ticks"></ol>
      </div>
      <a class="watch" id="watch" hidden>Watch</a>
    </footer>
    <p class="live" id="live" aria-live="polite"></p>
    <script src="js/reel.js"></script>
  </body>
</html>
