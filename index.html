<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Laura Ramirez F. Portfolio</title>
    <meta
      name="description"
      content="Laura Ramírez — creative producer and post-production lead. Motion, story, and intention."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400;0,500;0,600;1,400&family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/site.css" />
  </head>
  <body data-page="home">
    <a class="skip" href="#main">Skip to work</a>
    <header class="masthead" data-masthead></header>
    <main id="main">
      <section class="hero">
        <div class="hero-frame">
          <video
            autoplay
            muted
            loop
            playsinline
            poster="https://framerusercontent.com/images/o5uXNQynLco1HC0d1ntfDRliP0.jpg?width=1590&height=1200"
            src="https://framerusercontent.com/assets/KDlei2rmALrJ6yXHKWbvTPaNc4.mp4"
          ></video>
        </div>
      </section>
      <div class="wrap">
        <section class="home-split">
          <p class="lede" data-lede></p>
          <div data-home-feature></div>
        </section>
        <section class="home-rest pair" data-home-categories></section>
        <section class="about" data-about></section>
        <section class="columns">
          <div>
            <h2>Clients</h2>
            <ul data-clients></ul>
          </div>
          <div>
            <h2>Services</h2>
            <ul data-services></ul>
          </div>
        </section>
        <p class="cta" data-cta></p>
        <footer class="site-footer" data-footer></footer>
      </div>
    </main>
    <div class="player" data-player hidden>
      <div class="player-frame">
        <div data-player-frame></div>
        <div class="player-bar">
          <span data-player-title></span>
          <button class="player-close" type="button">Close</button>
        </div>
      </div>
    </div>
    <script src="js/site.js"></script>
  </body>
</html>
